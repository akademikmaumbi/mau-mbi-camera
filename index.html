<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAU MBI - Kamera Pengawasan</title><style>body{font-family:Arial,sans-serif;background:#0f172a;color:#0f172a;margin:0;padding:8px}.card{width:min(100%,340px);margin:4px auto;background:white;border-radius:14px;padding:14px;box-shadow:0 8px 24px #0004}h1{font-size:18px;margin:0 0 6px}.muted{color:#64748b;font-size:12px;line-height:1.4}video{display:block;width:100%;max-height:180px;aspect-ratio:4/3;object-fit:cover;background:#111827;border-radius:10px;transform:scaleX(-1);margin:8px auto 0}button{width:100%;padding:11px;border:0;border-radius:10px;background:#047857;color:white;font-weight:bold;font-size:13px;margin-top:9px}button:disabled{opacity:.55}label{display:flex;gap:8px;margin-top:10px;font-size:12px;line-height:1.35}.status{padding:9px;border-radius:10px;background:#ecfdf5;color:#065f46;font-size:12px;margin-top:9px}.warn{background:#fff7ed;color:#9a3412}.hidden{display:none}@media(max-width:480px){body{padding:6px}.card{width:100%;padding:12px}video{max-height:160px}}</style><script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.js" crossorigin="anonymous"></script></head>
<body><main class="card"><h1>Kamera Pengawasan Ujian</h1><p class="muted" id="student">Menghubungkan ke aplikasi ujian...</p><p class="muted">Kamera hanya digunakan untuk mendeteksi keberadaan wajah. Video tidak direkam, tidak dikirim, dan tidak disimpan. Berikan izin kamera untuk melanjutkan.</p><label><input type="checkbox" id="consent"><span>Saya memahami bahwa kamera akan aktif selama ujian dan status keberadaan wajah akan dilaporkan kepada pengawas.</span></label><video id="video" autoplay muted playsinline class="hidden"></video><div id="status" class="status">Menunggu koneksi dari aplikasi ujian.</div><button id="start" disabled>AKTIFKAN KAMERA</button><button id="stop" class="hidden" style="background:#475569">HENTIKAN KAMERA</button></main>
<script>
let parentOrigin='',token='',stream=null,detector=null,loop=null,heartbeat=null,lastFace='',running=false;const $=id=>document.getElementById(id);
function send(type,payload={}){if(window.opener&&!window.opener.closed)window.opener.postMessage({type,payload},'*');}
function setStatus(t,warn=false){$('status').textContent=t;$('status').className='status'+(warn?' warn':'');}
window.addEventListener('message',async e=>{if(!window.opener||e.source!==window.opener)return;const d=e.data||{};if(d.type==='MAU_INIT'){parentOrigin=e.origin;token=d.token||'';$('student').textContent=(d.studentName||'Peserta')+' · '+(d.className||'');$('start').disabled=false;setStatus('Terhubung. Centang persetujuan lalu aktifkan kamera.');}if(d.type==='MAU_START_MONITORING'){running=true;sendStatus('AKTIF',lastFace||'MENUNGGU','','Pengawasan kamera berjalan.');}if(d.type==='MAU_STOP'){stopCamera();}});
async function startCamera(){if(!$('consent').checked){setStatus('Centang persetujuan terlebih dahulu.',true);return;}if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setStatus('Browser/perangkat tidak mendukung akses kamera. Gunakan Chrome terbaru.',true);send('CAMERA_ERROR',{message:'API kamera tidak tersedia pada halaman GitHub Pages.'});return;}$('start').disabled=true;setStatus('Meminta izin kamera...');try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});$('video').srcObject=stream;$('video').classList.remove('hidden');await $('video').play();setStatus('Kamera aktif. Memuat deteksi wajah...');const vision=window.vision;if(!vision||!vision.FilesetResolver||!vision.FaceDetector)throw new Error('Library deteksi wajah gagal dimuat. Periksa koneksi internet.');const files=await vision.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');detector=await vision.FaceDetector.createFromOptions(files,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite',delegate:'CPU'},runningMode:'VIDEO',minDetectionConfidence:.55});$('start').classList.add('hidden');$('stop').classList.remove('hidden');setStatus('Kamera dan deteksi wajah siap. Biarkan jendela ini tetap terbuka.');send('CAMERA_READY');startDetection();}catch(err){stopCamera(false);const msg=explain(err);setStatus(msg,true);$('start').disabled=false;send('CAMERA_ERROR',{message:msg});}}
function explain(e){const n=e&&e.name;if(n==='NotAllowedError'||n==='PermissionDeniedError')return'Izin kamera ditolak. Klik ikon pengaturan situs pada address bar GitHub Pages lalu ubah Camera menjadi Allow. Periksa juga izin kamera Chrome di pengaturan perangkat.';if(n==='NotFoundError')return'Kamera tidak ditemukan pada perangkat.';if(n==='NotReadableError')return'Kamera sedang digunakan aplikasi lain. Tutup Zoom, Meet, Teams, atau aplikasi kamera.';return'Kamera gagal diaktifkan: '+(e&&e.message||n||'kesalahan tidak diketahui');}
function startDetection(){let busy=false;loop=setInterval(()=>{if(!running||busy||!detector||$('video').readyState<2)return;busy=true;try{const r=detector.detectForVideo($('video'),performance.now());const found=!!(r&&r.detections&&r.detections.length);const state=found?'TERDETEKSI':'TIDAK_TERDETEKSI';if(state!==lastFace){lastFace=state;sendStatus('AKTIF',state,found?'WAJAH_TERDETEKSI':'WAJAH_TIDAK_TERDETEKSI',found?'Wajah terdeteksi.':'Wajah tidak terdeteksi.');if(!found)setStatus('Wajah tidak terdeteksi. Posisikan wajah di depan kamera.',true);else setStatus('Kamera aktif. Wajah terdeteksi.');}}catch(e){sendStatus('AKTIF','GAGAL','DETEKSI_GAGAL',String(e.message||e));}finally{busy=false;}},1800);heartbeat=setInterval(()=>{if(running)sendStatus('AKTIF',lastFace||'MENUNGGU','','');},10000);const track=stream&&stream.getVideoTracks()[0];if(track)track.addEventListener('ended',()=>{sendStatus('TERPUTUS',lastFace||'TIDAK_DIKETAHUI','KAMERA_TERPUTUS','Akses kamera berhenti.');setStatus('Kamera terputus. Periksa perangkat.',true);});}
function sendStatus(camera,face,eventType,detail){send('CAMERA_STATUS',{camera,face,eventType,detail});}
function stopCamera(notify=true){running=false;clearInterval(loop);clearInterval(heartbeat);loop=heartbeat=null;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}if(detector){try{detector.close()}catch(e){}detector=null;}$('video').pause();$('video').srcObject=null;$('video').classList.add('hidden');$('stop').classList.add('hidden');$('start').classList.remove('hidden');$('start').disabled=false;setStatus('Kamera dihentikan.');if(notify)send('CAMERA_STOPPED');}
window.addEventListener('load',()=>send('CAMERA_MODULE_READY'));$('start').addEventListener('click',startCamera);$('stop').addEventListener('click',()=>{stopCamera();sendStatus('OFF','OFF','KAMERA_DIHENTIKAN','Kamera dihentikan dari jendela pengawasan.');});window.addEventListener('beforeunload',()=>{stopCamera(false);});
</script></body></html>
